<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description">
  <title id="title">AWS IoT Dashboard data flows</title>
  <desc id="description">The diagram shows browser static content and API flows, direct YOLO UNO telemetry and command acknowledgement flows to the ALB, persistence in RDS, and monitoring flows to CloudWatch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 33px Arial, sans-serif; fill: #0f172a; }
      .lane { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 400 14px Arial, sans-serif; fill: #334155; }
      .flow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .monitor { stroke: #7c3aed; stroke-width: 3; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="840" fill="#f8fafc"/>
  <text x="800" y="55" text-anchor="middle" class="title">Verified Application, API, IoT, and Monitoring Flows</text>
  <rect x="42" y="100" width="1515" height="185" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="140" class="lane">1. Browser flow</text>
  <rect x="90" y="170" width="165" height="65" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="172" y="199" text-anchor="middle" class="label">Web browser</text><text x="172" y="219" text-anchor="middle" class="detail">HTTPS</text>
  <rect x="390" y="170" width="190" height="65" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="485" y="199" text-anchor="middle" class="label">WAF + CloudFront</text><text x="485" y="219" text-anchor="middle" class="detail">viewer edge</text>
  <rect x="735" y="135" width="190" height="65" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="830" y="164" text-anchor="middle" class="label">S3 private origin</text><text x="830" y="184" text-anchor="middle" class="detail">Default (*)</text>
  <rect x="735" y="215" width="190" height="65" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="830" y="244" text-anchor="middle" class="label">ALB HTTP :80</text><text x="830" y="264" text-anchor="middle" class="detail">/api/* behavior</text>
  <rect x="1090" y="215" width="245" height="65" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/><text x="1212" y="244" text-anchor="middle" class="label">FastAPI on ASG targets</text><text x="1212" y="264" text-anchor="middle" class="detail">Target Group :8000</text>
  <path d="M255 202 H390" class="flow"/><path d="M580 190 H735" class="flow"/><text x="658" y="177" text-anchor="middle" class="detail">static application</text>
  <path d="M580 215 H650 V247 H735" class="flow"/><text x="657" y="238" text-anchor="middle" class="detail">GET/POST /api/*</text>
  <path d="M925 247 H1090" class="flow"/>

  <rect x="42" y="325" width="1515" height="205" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="72" y="365" class="lane">2. YOLO UNO direct ALB flow</text>
  <rect x="90" y="400" width="210" height="75" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/><text x="195" y="431" text-anchor="middle" class="label">YOLO UNO / ESP32-S3</text><text x="195" y="453" text-anchor="middle" class="detail">device_id=room_01</text>
  <rect x="510" y="400" width="190" height="75" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="605" y="431" text-anchor="middle" class="label">ALB DNS</text><text x="605" y="453" text-anchor="middle" class="detail">HTTP :80</text>
  <rect x="910" y="400" width="250" height="75" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/><text x="1035" y="431" text-anchor="middle" class="label">FastAPI</text><text x="1035" y="453" text-anchor="middle" class="detail">telemetry, commands, ACK</text>
  <rect x="1325" y="400" width="175" height="75" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="1412" y="431" text-anchor="middle" class="label">RDS PostgreSQL</text><text x="1412" y="453" text-anchor="middle" class="detail">Multi-AZ</text>
  <path d="M300 420 H510" class="flow"/><text x="405" y="408" text-anchor="middle" class="detail">POST telemetry</text>
  <path d="M300 452 H510" class="flow"/><text x="405" y="490" text-anchor="middle" class="detail">GET pending command / POST ACK</text>
  <path d="M700 437 H910" class="flow"/><path d="M1160 437 H1325" class="flow"/>

  <rect x="42" y="570" width="1515" height="220" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="72" y="610" class="lane">3. Observability and recovery flow</text>
  <rect x="140" y="650" width="240" height="80" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/><text x="260" y="681" text-anchor="middle" class="label">EC2 backend instances</text><text x="260" y="704" text-anchor="middle" class="detail">Uvicorn logs + guest metrics</text>
  <rect x="650" y="650" width="220" height="80" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="760" y="681" text-anchor="middle" class="label">ALB, ASG, RDS</text><text x="760" y="704" text-anchor="middle" class="detail">native metrics and health</text>
  <rect x="1135" y="650" width="265" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="1267" y="681" text-anchor="middle" class="label">Amazon CloudWatch</text><text x="1267" y="704" text-anchor="middle" class="detail">logs, dashboard, 8 alarms</text>
  <path d="M380 690 H1135" class="monitor"/><path d="M870 715 H1040 V708 H1135" class="monitor"/>
  <text x="505" y="676" text-anchor="middle" class="detail">CloudWatch Agent via IAM role</text>
  <text x="1000" y="750" text-anchor="middle" class="detail">No notification action is attached to the alarms</text>
</svg>
